# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment parameter names/javadoc: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Environment Properties

# Latest NeoForge versions: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact.
minecraft_version=1.21.1
# Version ranges can use any release version of Minecraft as bounds. Snapshots, pre-releases and
# release candidates are not guaranteed to sort properly.
minecraft_version_range=[1.21.1]
neo_version=21.1.250
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[1,)
neo_version_range=[21.1.244,21.2)

## Mod Properties

# The unique mod identifier. Must be lowercase in English locale, must fit the regex [a-z][a-z0-9_]{1,63}
# and must match the String constant in the main mod class annotated with @Mod.
mod_id=hungergames
# The human-readable display name for the mod.
mod_name=Hunger Games
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=1.4.0
# The group ID for the mod. Only important when publishing as an artifact to a Maven repository.
# Should match the base package used for the mod sources: https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=ru.studhub.hungergames
# Mod metadata shown in the mod list.
mod_authors=StudHub
mod_description=Hunger Games mod for Minecraft 1.21.1.
